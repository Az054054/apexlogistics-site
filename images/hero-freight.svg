<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Plane, cargo ship and delivery truck moving freight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b4f9c"/>
      <stop offset="1" stop-color="#5aa9ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <circle cx="1050" cy="90" r="46" fill="#ffd66b" opacity="0.9"/>
  <path d="M0 300 Q150 270 300 300 T600 300 T900 300 T1200 300 V420 H0 Z" fill="#1f6feb" opacity="0.55"/>
  <path d="M0 330 Q200 300 400 330 T800 330 T1200 330 V420 H0 Z" fill="#0b4f9c"/>
  <!-- cargo ship -->
  <g transform="translate(120 250)">
    <path d="M0 60 H300 L260 105 H40 Z" fill="#f5f7fa"/>
    <rect x="30" y="20" width="60" height="40" fill="#e04f3b"/>
    <rect x="95" y="20" width="60" height="40" fill="#f2b233"/>
    <rect x="160" y="20" width="60" height="40" fill="#2a9d8f"/>
    <rect x="225" y="30" width="30" height="30" fill="#f5f7fa"/>
    <rect x="30" y="0" width="0" height="0"/>
  </g>
  <!-- plane -->
  <g transform="translate(560 90) scale(1.1)">
    <path d="M0 20 L140 20 L170 0 L185 0 L150 30 L210 40 L230 30 L240 36 L210 58 L-20 58 L-40 45 Z" fill="#ffffff"/>
    <path d="M70 26 L100 -40 L115 -40 L95 26 Z" fill="#dfe9f7"/>
    <path d="M70 52 L100 110 L115 110 L95 52 Z" fill="#dfe9f7"/>
  </g>
  <!-- truck -->
  <g transform="translate(780 230)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#ffffff"/>
    <rect x="200" y="40" width="70" height="70" rx="6" fill="#ffffff"/>
    <path d="M212 50 H258 V80 H212 Z" fill="#8fc2ff"/>
    <rect x="20" y="30" width="160" height="10" fill="#1f6feb"/>
    <rect x="20" y="50" width="160" height="10" fill="#1f6feb" opacity="0.5"/>
    <circle cx="50" cy="118" r="20" fill="#1d2630"/>
    <circle cx="230" cy="118" r="20" fill="#1d2630"/>
    <circle cx="50" cy="118" r="7" fill="#c7d2e0"/>
    <circle cx="230" cy="118" r="7" fill="#c7d2e0"/>
  </g>
  <rect y="390" width="1200" height="30" fill="#0f1b2b" opacity="0.4"/>
</svg>
